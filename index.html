<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ojos de Robot Emocionales</title>
    <style>
        :root {
            /* Variables para controlar la forma de los ojos de manera fluida */
            --eye-height: 150px;
            --eye-radius: 50%;
            --eye-rotate-left: 0deg;
            --eye-rotate-right: 0deg;
            --eyebrow-transform: translateY(0px);
        }

        body {
            margin: 0;
            background-color: #0c0f12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .face {
            display: flex;
            gap: 80px;
            margin-bottom: 50px;
        }

        .eye-container {
            position: relative;
        }

        /* Cejas del robot */
        .eyebrow {
            width: 160px;
            height: 20px;
            background-color: #00ffcc;
            position: absolute;
            top: -40px;
            left: -5px;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ffcc;
            /* Transición suave para movimiento de cejas */
            transition: transform 0.8s ease-in-out;
            transform: var(--eyebrow-transform);
        }

        /* Ojos del robot */
        .eye {
            width: 150px;
            height: var(--eye-height);
            background-color: #00ffcc;
            border-radius: var(--eye-radius);
            box-shadow: 0 0 30px #00ffcc, inset 0 0 20px rgba(0,0,0,0.5);
            /* La magia de la transición gradual ocurre aquí */
            transition: border-radius 0.8s ease-in-out, height 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        .left {
            transform: rotate(var(--eye-rotate-left));
        }

        .right {
            transform: rotate(var(--eye-rotate-right));
        }

        /* Interfaz de voz */
        .controls {
            text-align: center;
        }

        button {
            background-color: #00ffcc;
            color: #0c0f12;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #ffffff;
            box-shadow: 0 0 25px #ffffff;
        }

        button:disabled {
            background-color: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #88a0a8;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="face">
        <div class="eye-container">
            <div class="eyebrow" id="brow-left"></div>
            <div class="eye left" id="eye-left"></div>
        </div>
        <div class="eye-container">
            <div class="eyebrow" id="brow-right"></div>
            <div class="eye right" id="eye-right"></div>
        </div>
    </div>

    <div class="controls">
        <button id="start-btn">Activar Reconocimiento de Voz</button>
        <p id="status">Haz clic en el botón y di: "feliz", "triste", "enojado" o "normal"</p>
    </div>

    <script>
        const root = document.documentElement;
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');

        // Configuración de las emociones modificando variables CSS
        const emociones = {
            normal: () => {
                root.style.setProperty('--eye-height', '150px');
                root.style.setProperty('--eye-radius', '50%');
                root.style.setProperty('--eye-rotate-left', '0deg');
                root.style.setProperty('--eye-rotate-right', '0deg');
                root.style.setProperty('--eyebrow-transform', 'translateY(0px) rotate(0deg)');
            },
            feliz: () => {
                // Ojos semicirculares hacia arriba (comprimidos por abajo)
                root.style.setProperty('--eye-height', '100px');
                root.style.setProperty('--eye-radius', '50% 50% 0% 0%');
                root.style.setProperty('--eye-rotate-left', '0deg');
                root.style.setProperty('--eye-rotate-right', '0deg');
                root.style.setProperty('--eyebrow-transform', 'translateY(-15px) rotate(0deg)');
            },
            triste: () => {
                // Ojos caídos e inclinados
                root.style.setProperty('--eye-height', '130px');
                root.style.setProperty('--eye-radius', '40% 40% 50% 50%');
                root.style.setProperty('--eye-rotate-left', '-15deg');
                root.style.setProperty('--eye-rotate-right', '15deg');
                root.style.setProperty('--eyebrow-transform', 'translateY(5px) rotate(0deg)');
                // Inclinación extra individual para las cejas de pena
                document.getElementById('brow-left').style.transform = 'translateY(0px) rotate(-15deg)';
                document.getElementById('brow-right').style.transform = 'translateY(0px) rotate(15deg)';
                return; // Salimos para evitar que el override global de cejas lo pise
            },
            enojado: () => {
                // Ojos achicados e inclinados hacia el centro
                root.style.setProperty('--eye-height', '110px');
                root.style.setProperty('--eye-radius', '50% 50% 30% 30%');
                root.style.setProperty('--eye-rotate-left', '20deg');
                root.style.setProperty('--eye-rotate-right', '-20deg');
                // Cejas bajas e inclinadas
                document.getElementById('brow-left').style.transform = 'translateY(15px) rotate(15deg)';
                document.getElementById('brow-right').style.transform = 'translateY(15px) rotate(-15deg)';
                return;
            }
        };

        // Configuración de la API de Reconocimiento de Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            statusText.innerText = "Tu navegador no soporta reconocimiento de voz. Usa Chrome o Edge.";
            startBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES'; // Idioma español
            recognition.continuous = false; // Escucha una orden a la vez
            recognition.interimResults = false; // Solo resultados finales

            startBtn.addEventListener('click', () => {
                recognition.start();
                statusText.innerText = "Escuchando... Di una emoción.";
                startBtn.textContent = "Micrófono Activo";
            });

            recognition.onresult = (event) => {
                // Captura lo que entendió el micrófono y lo pasa a minúsculas
                const comando = event.results[0][0].transcript.toLowerCase();
                statusText.innerText = `Escuché: "${comando}"`;
                startBtn.textContent = "Activar Reconocimiento de Voz";

                // Limpieza de las cejas por si venían de triste/enojado
                document.getElementById('brow-left').style.transform = '';
                document.getElementById('brow-right').style.transform = '';

                // Verifica qué palabra clave está en la frase dicha
                if (comando.includes('feliz') || comando.includes('alegre')) {
                    emociones.feliz();
                } else if (comando.includes('triste') || comando.includes('pena')) {
                    emociones.triste();
                } else if (comando.includes('enojado') || comando.includes('furioso') || comando.includes('enfadado')) {
                    emociones.enojado();
                } else if (comando.includes('normal') || comando.includes('reiniciar') || comando.includes('base')) {
                    emociones.normal();
                } else {
                    statusText.innerText = `Comando no reconocido ("${comando}"). Prueba con feliz, triste, enojado o normal.`;
                }
            };

            recognition.onerror = (event) => {
                statusText.innerText = `Error en el reconocimiento: ${event.error}`;
                startBtn.textContent = "Activar Reconocimiento de Voz";
            };

            recognition.onend = () => {
                if(statusText.innerText === "Escuchando... Di una emoción.") {
                    statusText.innerText = "Se terminó el tiempo. Haz clic para intentar de nuevo.";
                    startBtn.textContent = "Activar Reconocimiento de Voz";
                }
            };
        }
    </script>
</body>
</html>
